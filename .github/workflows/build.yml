name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build release
        run: gradle assembleRelease --no-daemon
      - name: Sign APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          keytool -genkeypair -keystore ci.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Launcher"
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks ci.jks --ks-pass pass:android --key-pass pass:android --out launcher.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher.apk
